name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          [ -f www/index.html ] || cp index.html www/index.html

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          [ -f capacitor.config.json ] || npx cap init "Mpamantatra accord" mg.mpamantatra.accord --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add microphone permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$MANIFEST"
          grep -n "RECORD_AUDIO" "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: accord-finder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
